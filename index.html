<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDoTasks</title>
  <script>
    // Aplica el tema guardado en este dispositivo antes de pintar la página (evita parpadeo)
    try { document.documentElement.dataset.tema = localStorage.getItem("todotasks-tema") === "claro" ? "claro" : "oscuro"; }
    catch (e) { document.documentElement.dataset.tema = "oscuro"; }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="izquierda">
      <button id="btn-menu" class="menu" type="button" title="Mostrar u ocultar el menú" hidden>☰</button>
      <h1 id="titulo-app" title="Ir a todas las tareas">ToDoTasks</h1>
    </div>
  </header>

  <section id="pantalla-login" class="centrado" hidden>
    <p>Inicia sesión para ver tus tareas.</p>
    <button id="btn-login" type="button">Entrar con Google</button>
  </section>

  <div id="pantalla-app" class="layout" hidden>
    <aside class="barra">
      <div id="contenido-barra">
        <label class="nav-item">
          <input id="chk-todas" type="checkbox">
          <span class="nombre">Todas las tareas</span>
          <span id="cnt-todas" class="conteo">0</span>
        </label>

        <button id="btn-sec-categorias" class="nav-seccion-btn" type="button" aria-expanded="true">▾ Categorías</button>
        <div id="contenido-categorias">
          <button id="btn-crear-cat" class="nav-accion" type="button">
            <span class="icono">+</span><span>Crear categoría</span>
          </button>
          <nav id="nav-categorias"></nav>
          <button id="btn-modificar-cat" class="nav-accion" type="button">
            <span class="icono">✎</span><span>Modificar categorías</span>
          </button>
        </div>

        <button id="nav-papelera" class="nav-item" type="button">
          <span class="icono">🗑</span>
          <span class="nombre">Papelera</span>
          <span id="cnt-papelera" class="conteo">0</span>
        </button>

        <hr class="separador">

        <button id="btn-sec-config" class="nav-seccion-btn" type="button" aria-expanded="false">▸ Configuración</button>
        <div id="contenido-config" hidden>
          <label class="fila-config">Tema:
            <select id="selector-tema">
              <option value="oscuro">Oscuro</option>
              <option value="claro">Claro</option>
            </select>
          </label>
        </div>
      </div>
    </aside>

    <main>
      <h2 id="titulo-vista">Todas las tareas</h2>

      <form id="form-tarea" class="nueva-tarea">
        <select id="categoria" required></select>
        <input id="titulo" placeholder="Nueva tarea" required>
        <label class="cal-btn" title="Deadline (hora de Santiago, opcional)">📅<input id="deadline" class="overlay-fecha" type="datetime-local"></label>
        <button id="btn-agregar" type="submit" title="Agregar tarea" aria-label="Agregar tarea">+</button>
      </form>

      <hr class="separador">

      <div id="barra-orden" class="orden-bar">
        <label for="orden">Ordenar por</label>
        <select id="orden">
          <option value="deadline">Deadline (próximo primero)</option>
          <option value="creada">Más recientes</option>
        </select>
      </div>

      <div id="lista"></div>
    </main>
  </div>

  <!-- Crear categoría -->
  <dialog id="dlg-crear">
    <h3>Nueva categoría</h3>
    <form id="form-categoria" class="nueva-categoria">
      <input id="cat-nombre" placeholder="Nombre" maxlength="30" required>
      <div id="cat-swatches"></div>
      <div class="dlg-acciones">
        <button id="btn-cancelar-cat" class="secundario" type="button">Cancelar</button>
        <button type="submit">Crear</button>
      </div>
    </form>
  </dialog>

  <!-- Modificar categorías (la papelera está en la barra lateral) -->
  <dialog id="dlg-modificar">
    <h3>Modificar categorías</h3>
    <div id="lista-categorias"></div>
    <div class="dlg-acciones">
      <button id="btn-cerrar-mod" type="button">Cerrar</button>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
